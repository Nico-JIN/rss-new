# ═══════════════════════════════════════════════════════════════════════════════
# 六大分类规则
# ═══════════════════════════════════════════════════════════════════════════════

categories:
  # ────────────────────────────────────────────────────────────────────────────
  # ① 国际热点（最高优先级）
  # ────────────────────────────────────────────────────────────────────────────
  international:
    name: 国际热点
    description: 重大国际事件、多国参与的热点新闻（如美伊谈判、俄乌冲突等）
    # INTL 表示国际/多国事件
    primary:
      - INTL
    # 多国参与也归入此类
    multi_country_threshold: 2  # 涉及2个以上国家
    min_score: 50  # 热度阈值
    priority: 100  # 最高优先级，优先匹配

  # ────────────────────────────────────────────────────────────────────────────
  # ② 外媒中国新闻
  # ────────────────────────────────────────────────────────────────────────────
  foreign_china:
    name: 外媒报道中国
    description: 外国媒体对中国大陆的报道（不含港澳台）
    primary:
      - CN
    # 排除国内媒体来源
    primary_exclude_sources: chinese_domestic_media
    # related 触发条件
    related_trigger:
      - CN
    related_require_tier: S
    related_exclude_primary:
      - HK
      - MO
      - TW

  # ────────────────────────────────────────────────────────────────────────────
  # ② 美国新闻
  # ────────────────────────────────────────────────────────────────────────────
  us_news:
    name: 美国新闻
    description: 美国内政、外交、军事、经济新闻
    primary:
      - US
    related_trigger: []

  # ────────────────────────────────────────────────────────────────────────────
  # ③ 日本新闻
  # ────────────────────────────────────────────────────────────────────────────
  japan_news:
    name: 日本新闻
    description: 日本政治、经济、军事、外交新闻
    primary:
      - JP
    related_trigger: []

  # ────────────────────────────────────────────────────────────────────────────
  # ④ 港澳台新闻
  # ────────────────────────────────────────────────────────────────────────────
  greater_china:
    name: 港澳台新闻
    description: 香港、台湾、澳门政治与社会新闻
    primary:
      - HK
      - MO
      - TW
    related_trigger: []

  # ────────────────────────────────────────────────────────────────────────────
  # ⑤ 中东新闻
  # ────────────────────────────────────────────────────────────────────────────
  middle_east:
    name: 中东新闻
    description: 中东地区冲突、石油、外交新闻
    primary:
      - IL
      - PS
      - IR
      - SA
      - TR
      - IQ
      - SY
      - YE
      - LB
      - EG
      - JO
      - KW
      - AE
      - QA
      - BH
      - OM
      - LY
      - TN
      - DZ
      - MA
    related_trigger: []

  # ────────────────────────────────────────────────────────────────────────────
  # ⑥ 亚洲其他（排除 CN / JP / HK / MO / TW）
  # ────────────────────────────────────────────────────────────────────────────
  asia_other:
    name: 亚洲其他国家
    description: 亚洲周边国家新闻（不含中日港澳台）
    primary:
      - KR
      - IN
      - SG
      - MY
      - TH
      - VN
      - PH
      - ID
      - PK
      - BD
      - LK
      - NP
      - MM
      - KH
      - LA
      - BN
      - MN
      - KZ
      - UZ
      - AF
    related_trigger: []

# ═══════════════════════════════════════════════════════════════════════════════
# 热点评分配置
# ═══════════════════════════════════════════════════════════════════════════════

scoring:
  # 热点评分公式
  s_tier_weight: 10
  normal_weight: 1
  source_weight: 2

  # 热点入选条件
  min_score: 10
  min_articles: 3
  s_tier_automatch: true

  # 每个分类最多保留热点数
  max_hotspots_per_category: 50
