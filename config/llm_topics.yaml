# LLM 语义打标配置
# 修改 topics 列表即可增删分类主题，无需改动代码

llm:
  enabled: true
  # 提供商选项:
  # - "gemini": 使用 Google Gemini（优先）
  # - "deepseek": 使用原生 DeepSeek 官方接口
  # - "volcengine": 使用豆包 (Ark) 专用逻辑
  # - "ollama": 使用本地 Ollama（兜底）
  # - "qwen3.5-plus", "glm-5", "glm-4.7", "kimi-k2.5", "MiniMax-M2.5":
  #   使用下方的 writing_aggregator 聚合配置
  provider: "gemini"

  # 1. 官方 DeepSeek 配置 (已恢复原有设置)
  api_key: "sk-7535891638454e09b8e38f92686c91bb"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

  # 2. 新增写作模型聚合配置 (基于博汇接口)
  writing_aggregator:
    api_key: "sk-1YRfBCfqPgWD9TcPDPH1jvc3cUeQQsEcps8jhNvu65JdMyjf"
    base_url: "https://aicoding.bwits.cn:90/v1"

  # 豆包 (火山引擎 Ark) 配置
  volcengine:
    api_key: "7c321d64-5ac0-4776-ac9a-ec61a915a9fa"
    model: "doubao-seed-2.0-pro"
    base_url: "https://ark.cn-beijing.volces.com/api/coding/v3"

  # Gemini 配置
  gemini:
    api_key: "AIzaSyASkk-TAW-FJ_E3niorcu7Cy0uBvZXG_V8"
    model: "gemini-2.5-flash"
    base_url: "https://generativelanguage.googleapis.com"

  # Ollama 本地模型配置（兜底）
  ollama:
    api_key: "ollama"
    base_url: "http://127.0.0.1:11434/v1"
    model: "gemma4:e2b"

  max_batch: 20          # 每批最多打包的文章数
  temperature: 0.1       # 稳定性参数
  timeout: 120           # API 超时时间 (秒)

# ═══════════════════════════════════════════════════════════════════════════════
# 翻译/大纲提取专用模型配置
# ═══════════════════════════════════════════════════════════════════════════════
#
# 【配置位置说明】
# 大纲提取使用的模型配置就在下方的 translation_llm 部分
#
# 【本地模型选项】
# provider: "ollama"    → 使用 Ollama（Windows/Linux/Mac 通用）
#                         需要先安装 Ollama 并下载模型: ollama pull gemma4:e2b
#                         默认端口: http://localhost:11434
#
# provider: "lmstudio"  → 使用 LM Studio（Mac/Windows 推荐）
#                         需要先安装 LM Studio 并启动本地服务
#                         默认端口: http://localhost:1234
#
# provider: "omlx"      → 使用 Omlx（Mac 推荐）
#                         Mac 上的本地推理工具
#                         默认端口: http://localhost:8899
#
# 【切换本地模型的方法】
# 修改下方的 provider 和对应的 base_url、model
#
# ═══════════════════════════════════════════════════════════════════════════════

translation_llm:
  enabled: true

  # ── 云端模型配置（切换到 DeepSeek 加速大纲提取）──────────────────────
  # 使用 DeepSeek 云端 API，推理速度快，稳定性高
  provider: "deepseek"

  # DeepSeek 配置
  api_key: "sk-7535891638454e09b8e38f92686c91bb"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

  # ── 本地模型配置（已禁用）────────────────────────────────────────────────
  # 选择 provider: "ollama" / "lmstudio" / "omlx"
  # provider: "ollama"

  # Ollama 配置（当前使用）
  # api_key: "ollama"      # Ollama 不需要真实 API Key，填任意值即可
  # base_url: "http://127.0.0.1:11434/v1"
  # model: "gemma4:e2b"    # 模型名称，运行 `ollama list` 查看可用模型

  # LM Studio 配置（如需切换，取消注释并修改 provider）
  # api_key: "lmstudio"
  # base_url: "http://localhost:1234/v1"
  # model: ""             # 留空则使用 LM Studio 已加载的模型

  # Omlx 配置（Mac 用户推荐）
  # api_key: "omlx"
  # base_url: "http://localhost:8899/v1"
  # model: ""             # 留空则使用 Omlx 已加载的模型

  # ── 调用参数 ───────────────────────────────────────────────────────────────
  timeout: 180           # 超时时间（秒），本地模型推理较慢，建议 180+
  temperature: 0.3       # 温度参数，大纲提取建议 0.3

  # ── 大纲提取专用配置 ───────────────────────────────────────────────────────
  outline_extraction:
    batch_size_full: 3       # 完整正文批量大小
    batch_size_short: 10     # 标题摘要批量大小
    max_workers: 6           # 并发数（云端 API 可承受更高并发）
    max_content_length: 3000 # 正文截断长度

topics:
  - name: "中国言论"
    description: >
      主要是针对外媒对中国的报道，包括新闻、评论、分析、大国博弈等，同时包括但不限于：涉及到香港、台湾的社论与评论、中国国务院及各部委的
      政策声明、中国领导人在国际场合的讲话与表态、中国对国际事件的官方回应与立场阐述。

  - name: "国际热点"
    description: >
      当前全球重大突发事件与持续关注的焦点议题，包括但不限于：武装冲突与战争动态、
      重大自然灾害与人道主义危机、联合国及国际组织的重大决议或行动、全球性公共卫生事件、
      国际峰会与多边外交会议成果、跨国恐怖主义事件、重大国际制裁与经济封锁。

  - name: "大国博弈"
    description: >
      大国之间的战略竞争与合作动态，包括但不限于：中美关系（贸易战、科技脱钩、台海局势、
      南海争端）、中欧关系（经贸摩擦、人权议题、一带一路）、中日关系（历史问题、领土争议、
      经济合作）、中俄关系（战略协作、能源合作、军事联动）、美俄对抗（北约东扩、核军控、
      代理人战争）、其他涉及两个或多个主要国家之间战略层面的对抗、谈判或联盟重组。
