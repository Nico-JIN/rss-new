# LLM 语义打标配置
# 修改 topics 列表即可增删分类主题，无需改动代码

llm:
  enabled: true
  # 提供商选项: 
  # - "deepseek": 使用原生 DeepSeek 官方接口
  # - "volcengine": 使用豆包 (Ark) 专用逻辑
  # - "qwen3.5-plus", "glm-5", "glm-4.7", "kimi-k2.5", "MiniMax-M2.5": 
  #   使用下方的 writing_aggregator 聚合配置
  provider: "deepseek"
  
  # 1. 官方 DeepSeek 配置 (已恢复原有设置)
  api_key: "sk-7535891638454e09b8e38f92686c91bb"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  
  # 2. 新增写作模型聚合配置 (基于博汇接口)
  writing_aggregator:
    api_key: "sk-1YRfBCfqPgWD9TcPDPH1jvc3cUeQQsEcps8jhNvu65JdMyjf"
    base_url: "https://aicoding.bwits.cn:90/v1"
  
  # 豆包 (火山引擎 Ark) 配置
  volcengine:
    api_key: "7c321d64-5ac0-4776-ac9a-ec61a915a9fa"         # 请填入您的 Ark API Key
    model: "doubao-seed-2-0-pro-260215"  # 请填入您的 Endpoint ID
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
  
  max_batch: 20          # 每批最多打包的文章数
  temperature: 0.1       # 稳定性参数
  timeout: 120           # API 超时时间 (秒)

topics:
  - name: "中国言论"
    description: >
      主要是针对外媒对中国的报道，包括新闻、评论、分析、大国博弈等，同时包括但不限于：涉及到香港、台湾的社论与评论、中国国务院及各部委的
      政策声明、中国领导人在国际场合的讲话与表态、中国对国际事件的官方回应与立场阐述。

  - name: "国际热点"
    description: >
      当前全球重大突发事件与持续关注的焦点议题，包括但不限于：武装冲突与战争动态、
      重大自然灾害与人道主义危机、联合国及国际组织的重大决议或行动、全球性公共卫生事件、
      国际峰会与多边外交会议成果、跨国恐怖主义事件、重大国际制裁与经济封锁。

  - name: "大国博弈"
    description: >
      大国之间的战略竞争与合作动态，包括但不限于：中美关系（贸易战、科技脱钩、台海局势、
      南海争端）、中欧关系（经贸摩擦、人权议题、一带一路）、中日关系（历史问题、领土争议、
      经济合作）、中俄关系（战略协作、能源合作、军事联动）、美俄对抗（北约东扩、核军控、
      代理人战争）、其他涉及两个或多个主要国家之间战略层面的对抗、谈判或联盟重组。
