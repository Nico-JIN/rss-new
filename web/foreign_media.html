<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外媒舆情聚合测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00f3ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1::before {
            content: '🌍';
        }

        /* 搜索区域 */
        .search-box {
            background: #151520;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3a;
        }
        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #3a3a4a;
            border-radius: 8px;
            background: #1a1a25;
            color: #fff;
            font-size: 14px;
        }
        .search-input-group input:focus {
            outline: none;
            border-color: #00f3ff;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00f3ff, #0080ff);
            color: #000;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #2a2a3a;
            color: #00f3ff;
            border: 1px solid #3a3a4a;
        }
        .btn-secondary:hover {
            background: #3a3a4a;
            border-color: #00f3ff;
        }

        /* 搜索引擎结果区块 */
        .source-result-block {
            background: #151520;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2a3a;
            overflow: hidden;
            display: none;
        }
        .source-result-block.active {
            display: block;
        }
        .source-result-block.done {
            border-color: rgba(0, 243, 255, 0.3);
        }
        .source-header {
            padding: 15px 20px;
            background: #1a1a25;
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .source-header:hover {
            background: #1f1f2a;
        }
        .source-header .expand-icon {
            font-size: 12px;
            color: #888;
            transition: transform 0.3s ease;
        }
        .source-header.expanded .expand-icon {
            transform: rotate(180deg);
        }
        .source-header h3 {
            font-size: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .source-header .source-icon {
            font-size: 18px;
        }
        .source-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .source-status.running {
            color: #ffa500;
        }
        .source-status.done {
            color: #00f3ff;
        }
        .source-status.error {
            color: #ff4444;
        }
        .source-count {
            background: #2a2a3a;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #00f3ff;
        }

        /* AI 搜索引擎特殊布局 */
        .ai-result-layout {
            display: flex;
            gap: 0;
        }
        .ai-main-content {
            flex: 1;
            min-width: 0;
            padding: 20px;
            border-right: 1px solid #2a2a3a;
        }
        .ai-sources-panel {
            width: 320px;
            flex-shrink: 0;
            background: #0f0f15;
            max-height: 500px;
            overflow-y: auto;
        }
        .ai-main-content h4 {
            color: #00f3ff;
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-main-content .ai-text {
            font-size: 14px;
            line-height: 1.8;
            color: #d0d0d0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .ai-main-content .ai-text a {
            color: #00f3ff;
            text-decoration: none;
        }
        .ai-main-content .ai-text a:hover {
            text-decoration: underline;
        }
        .ai-sources-header {
            padding: 12px 15px;
            background: #1a1a25;
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #2a2a3a;
            position: sticky;
            top: 0;
        }
        .ai-sources-header span {
            color: #00f3ff;
            font-weight: 600;
        }
        /* 传统搜索源的文章列表 */
        .source-articles {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .source-articles.expanded {
            max-height: 800px;
            overflow-y: auto;
        }
        .article-item {
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a3a;
            cursor: pointer;
            transition: background 0.2s;
        }
        .article-item:hover {
            background: #1a1a25;
        }
        .article-item:last-child {
            border-bottom: none;
        }
        .article-source {
            font-size: 11px;
            color: #00f3ff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .country-tag {
            background: #2a2a3a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        .article-title {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.5;
        }
        .article-meta {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            display: flex;
            gap: 15px;
        }

        /* YouTube 视频卡片 */
        .youtube-card {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #2a2a3a;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
        }
        .youtube-card:hover {
            background: #1a1a25;
        }
        .youtube-thumbnail {
            width: 160px;
            height: 90px;
            background: #2a2a3a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .youtube-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .youtube-thumbnail .no-thumb {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ff0000;
        }
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .youtube-card:hover .play-overlay {
            opacity: 1;
        }
        .play-overlay span {
            font-size: 24px;
            color: #fff;
        }
        .youtube-info {
            flex: 1;
            min-width: 0;
        }
        .youtube-title {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .youtube-meta {
            font-size: 11px;
            color: #888;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .youtube-channel {
            color: #00f3ff;
        }
        .youtube-duration {
            background: #2a2a3a;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* YouTube 视频播放弹窗 */
        .youtube-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .youtube-modal-content {
            background: #151520;
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0,243,255,0.2);
        }
        .youtube-modal-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a3a;
        }
        .youtube-modal-title {
            font-size: 14px;
            color: #e0e0e0;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .youtube-modal-close {
            background: #ff4444;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .youtube-modal-close:hover {
            background: #ff6666;
        }
        .youtube-player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }
        .youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 汇总区域 */
        .summary-section {
            background: #151520;
            border-radius: 12px;
            margin-top: 20px;
            border: 2px solid #00f3ff;
            overflow: hidden;
            display: none;
        }
        .summary-section.active {
            display: block;
        }
        .summary-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(0, 128, 255, 0.1));
            border-bottom: 1px solid #2a2a3a;
        }
        .summary-header h2 {
            font-size: 16px;
            color: #00f3ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .summary-stats {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .summary-stat {
            background: #1a1a25;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
        }
        .summary-stat .label {
            color: #888;
        }
        .summary-stat .value {
            color: #00f3ff;
            font-weight: 600;
            margin-left: 5px;
        }

        /* 汇总文章列表 */
        .summary-articles {
            max-height: 500px;
            overflow-y: auto;
        }
        .filter-tabs {
            padding: 10px 20px;
            background: #1a1a25;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            background: #2a2a3a;
            color: #888;
            border: none;
            transition: all 0.2s;
        }
        .filter-tab:hover {
            background: #3a3a4a;
        }
        .filter-tab.active {
            background: #00f3ff;
            color: #000;
        }

        /* 立场分析 */
        .analysis-section {
            background: #151520;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #2a2a3a;
            display: none;
        }
        .analysis-section.active {
            display: block;
        }
        .analysis-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00f3ff;
        }
        .country-analysis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .country-card {
            background: #1a1a25;
            border-radius: 8px;
            padding: 15px;
            border-left: 3px solid #00f3ff;
        }
        .country-card h3 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
        }
        .stance-item {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }
        .stance-item span {
            color: #e0e0e0;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .empty-state .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #333;
            border-radius: 50%;
            border-top-color: #00f3ff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 迷你加载 */
        .mini-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #333;
            border-radius: 50%;
            border-top-color: #ffa500;
            animation: spin 1s linear infinite;
        }

        /* 分类勾选区 */
        .source-selector {
            font-size: 14px;
            margin-top: 15px;
            border-top: 1px solid #2a2a3a;
            padding-top: 15px;
        }
        .source-selector > div:first-child {
            margin-bottom: 10px;
            color: #888;
        }
        .source-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .source-category {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .source-category strong {
            color: #00f3ff;
            font-size: 13px;
        }
        .source-category label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Ollama 配置区 */
        .ollama-config {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a3a;
        }
        .ollama-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .ollama-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .ollama-status.online {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
        }
        .ollama-status.offline {
            background: rgba(255, 100, 100, 0.1);
            color: #ff6b6b;
        }
        .ollama-model-select {
            padding: 8px 12px;
            border: 1px solid #3a3a4a;
            border-radius: 6px;
            background: #1a1a25;
            color: #fff;
            font-size: 13px;
            min-width: 180px;
        }
        .ollama-model-select:focus {
            outline: none;
            border-color: #00f3ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>外媒舆情聚合测试</h1>

        <!-- 搜索区域 -->
        <div class="search-box">
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="输入中文关键词，如：台海局势、中美贸易、芯片制裁..." value="台海 军演 中国">
                <button class="btn btn-primary" id="searchBtn" onclick="startSearch()">开始搜索</button>
            </div>

            <!-- Ollama 本地模型配置 -->
            <div class="ollama-config" id="ollamaConfigSection">
                <div class="ollama-header">
                    <strong style="color: #00f3ff;">🦙 本地模型 (Ollama)</strong>
                    <span class="ollama-status offline" id="ollamaStatus">检测中...</span>
                </div>
                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 13px; color: #888;">选择模型:</span>
                        <select class="ollama-model-select" id="ollamaModelSelect">
                            <option value="">-- 加载中 --</option>
                        </select>
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px;">
                        <input type="checkbox" id="useOllamaTranslate" checked> 自动翻译标题为中文
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px;">
                        <input type="checkbox" id="useOllamaAnalysis" checked> 用于立场分析
                    </label>
                    <button class="btn btn-secondary" id="translateBtn" onclick="translateAllTitles()" style="padding:6px 12px;font-size:12px;background:#2a2a3a;color:#00f3ff;border:1px solid #00f3ff;display:none;">
                        🔄 翻译标题
                    </button>
                </div>
                </div>
            </div>

            <div class="source-selector">
                <div>请选择要检索的数据源 (可多选)：</div>
                <div class="source-group">
                    <div class="source-category">
                        <strong>🔎 搜索引擎</strong>
                        <label><input type="checkbox" name="search_source" value="google" checked> Google News</label>
                    </div>
                    <div class="source-category">
                        <strong>💬 社交媒体</strong>
                        <label><input type="checkbox" name="search_source" value="twitter"> Twitter</label>
                        <label><input type="checkbox" name="search_source" value="youtube"> YouTube</label>
                    </div>
                    <div class="source-category">
                        <strong>📰 新闻聚合</strong>
                        <label><input type="checkbox" name="search_source" value="rss" checked> RSS 国际媒体订阅</label>
                        <label><input type="checkbox" name="search_source" value="newsapi"> NewsAPI</label>
                    </div>
                    <div class="source-category">
                        <strong>🤖 AI搜索引擎</strong>
                        <label><input type="checkbox" name="search_source" value="perplexity"> Perplexity</label>
                        <label><input type="checkbox" name="search_source" value="tavily"> Tavily</label>
                        <label><input type="checkbox" name="search_source" value="brave"> Brave Search</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 动态结果区域：每个搜索引擎的结果会在这里依次显示 -->
        <div id="resultsContainer"></div>

        <!-- 汇总区域 -->
        <div class="summary-section" id="summarySection">
            <div class="summary-header">
                <h2>📊 汇总结果（去重后）</h2>
                <div class="summary-stats" id="summaryStats"></div>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" onclick="filterSummary('all')">全部</button>
            </div>
            <div class="summary-articles" id="summaryArticles">
                <div class="empty-state"><div class="icon">📭</div><div>等待搜索...</div></div>
            </div>
        </div>

        <!-- 立场分析 -->
        <div class="analysis-section" id="analysisSection">
            <h2>📈 各国媒体立场分析</h2>
            <div id="analysisContent"></div>
        </div>
    </div>

    <script>
        let allArticles = [];
        let sourceArticles = {}; // 按源存储
        let currentFilter = 'all';
        let selectedSources = [];
        let sourceCounts = {};
        let ollamaAvailable = false;
        let ollamaModels = [];

        const sourceNames = {
            'google': 'Google News',
            'rss': 'RSS 订阅',
            'twitter': 'Twitter',
            'newsapi': 'NewsAPI',
            'perplexity': 'Perplexity',
            'tavily': 'Tavily',
            'brave': 'Brave Search',
            'youtube': 'YouTube'
        };

        const sourceIcons = {
            'google': '🔍',
            'rss': '📰',
            'twitter': '🐦',
            'newsapi': '📡',
            'perplexity': '🤖',
            'tavily': '🧠',
            'brave': '🦁',
            'youtube': '▶️'
        };

        // 初始化时检查 Ollama 状态
        async function initOllama() {
            try {
                const resp = await fetch('/api/ollama/status');
                const data = await resp.json();

                ollamaAvailable = data.available;
                ollamaModels = data.models || [];

                const statusEl = document.getElementById('ollamaStatus');
                const selectEl = document.getElementById('ollamaModelSelect');

                if (data.available) {
                    statusEl.className = 'ollama-status online';
                    statusEl.textContent = '✅ 已连接';

                    // 填充模型列表
                    selectEl.innerHTML = '<option value="">选择模型...</option>';
                    ollamaModels.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.textContent = m.name;
                        if (m.name === data.current_model) opt.selected = true;
                        selectEl.appendChild(opt);
                    });

                    // 添加配置中的推荐模型
                    if (data.config_models && data.config_models.length > 0) {
                        const optGroup = document.createElement('optgroup');
                        optGroup.label = '推荐模型';
                        data.config_models.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m.name;
                            opt.textContent = `${m.name} (${m.description || ''})`;
                            if (m.name === data.current_model) opt.selected = true;
                            optGroup.appendChild(opt);
                        });
                        selectEl.appendChild(optGroup);
                    }
                } else {
                    statusEl.className = 'ollama-status offline';
                    statusEl.textContent = '❌ 未连接';
                    selectEl.innerHTML = '<option value="">服务不可用</option>';
                }
            } catch (e) {
                console.error('Ollama 状态检查失败:', e);
                document.getElementById('ollamaStatus').textContent = '❌ 检测失败';
            }
        }

        // 页面加载时初始化
        initOllama();

        async function startSearch() {
            const btn = document.getElementById('searchBtn');
            const input = document.getElementById('searchInput');
            const keywords = input.value.trim();

            if (!keywords) {
                alert('请输入搜索关键词');
                return;
            }

            const sourceCheckboxes = Array.from(document.querySelectorAll('input[name="search_source"]:checked'));
            selectedSources = sourceCheckboxes.map(cb => cb.value);

            if (selectedSources.length === 0) {
                alert('请至少勾选一个检索源');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 搜索中...';

            // 重置状态
            allArticles = [];
            sourceArticles = {};
            sourceCounts = {};
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('summarySection').classList.remove('active');
            document.getElementById('analysisSection').classList.remove('active');

            // 预先为每个选中的源创建结果区块（默认折叠）
            const container = document.getElementById('resultsContainer');
            selectedSources.forEach(src => {
                const block = document.createElement('div');
                block.className = 'source-result-block active';
                block.id = `block_${src}`;
                block.innerHTML = `
                    <div class="source-header" onclick="toggleSourceBlock('${src}')">
                        <h3>
                            <span class="source-icon">${sourceIcons[src] || '📡'}</span>
                            ${sourceNames[src] || src}
                            <span class="expand-icon">▼</span>
                        </h3>
                        <div class="source-status running" id="status_${src}">
                            <span class="mini-spinner"></span>
                            <span>等待中...</span>
                        </div>
                    </div>
                    <div class="source-articles" id="articles_${src}">
                        <div class="empty-state"><div class="icon">⏳</div><div>正在等待...</div></div>
                    </div>
                `;
                container.appendChild(block);
            });

            try {
                const response = await fetch('/api/foreign-media/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: keywords, sources: selectedSources })
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    alert('搜索失败: ' + (data.error || response.statusText));
                    btn.disabled = false;
                    btn.textContent = '开始搜索';
                    return;
                }

                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line.trim());

                            if (data.type === 'error') {
                                alert('发生错误: ' + data.error);
                            } else if (data.type === 'source_start') {
                                updateSourceStatus(data.source, 'running', '搜索中...');
                            } else if (data.type === 'source_result') {
                                const src = data.source;
                                const count = data.count || 0;
                                const articles = data.articles || [];
                                const isAiSearch = data.is_ai_search || false;
                                const aiAnswer = data.ai_answer || '';

                                // 更新状态
                                if (count > 0 || aiAnswer) {
                                    const statusText = isAiSearch && aiAnswer
                                        ? `AI分析 + ${count} 条来源`
                                        : `找到 ${count} 条`;
                                    updateSourceStatus(src, 'done', statusText);
                                    document.getElementById(`block_${src}`).classList.add('done');
                                } else {
                                    updateSourceStatus(src, 'error', data.error || '未找到结果');
                                }

                                // 存储并渲染该源的文章
                                sourceArticles[src] = articles;
                                sourceCounts[src] = count;
                                renderSourceArticles(src, articles, isAiSearch, aiAnswer);

                                // 有结果时自动展开
                                if (count > 0 || aiAnswer) {
                                    const block = document.getElementById(`block_${src}`);
                                    const header = block.querySelector('.source-header');
                                    const articlesEl = document.getElementById(`articles_${src}`);
                                    if (header && articlesEl) {
                                        header.classList.add('expanded');
                                        articlesEl.classList.add('expanded');
                                    }
                                }

                            } else if (data.type === 'done') {
                                // 显示汇总区域
                                allArticles = data.articles || [];
                                showSummary(data.total_count || 0, data.stance_analysis);
                            }

                        } catch (e) {
                            console.error('JSON解析错误', e, line);
                        }
                    }
                }

            } catch (e) {
                alert('请求失败: ' + e.message);
            }

            btn.disabled = false;
            btn.textContent = '开始搜索';
        }

        function updateSourceStatus(src, status, text) {
            const statusEl = document.getElementById(`status_${src}`);
            if (!statusEl) return;

            statusEl.className = `source-status ${status}`;
            if (status === 'running') {
                statusEl.innerHTML = `<span class="mini-spinner"></span><span>${text}</span>`;
            } else if (status === 'done') {
                statusEl.innerHTML = `<span class="source-count">${text}</span>`;
            } else if (status === 'error') {
                statusEl.innerHTML = `<span style="color:#ff6b6b">❌ ${text}</span>`;
            }
        }

        // 切换源区块的展开/折叠状态
        function toggleSourceBlock(src) {
            const block = document.getElementById(`block_${src}`);
            const header = block.querySelector('.source-header');
            const articles = document.getElementById(`articles_${src}`);

            if (header && articles) {
                header.classList.toggle('expanded');
                articles.classList.toggle('expanded');
            }
        }

        function renderSourceArticles(src, articles, isAiSearch, aiAnswer) {
            const container = document.getElementById(`articles_${src}`);
            if (!container) return;

            let html = '';

            // AI 搜索引擎：左侧 AI 分析，右侧来源列表
            if (isAiSearch && aiAnswer) {
                html += `
                    <div class="ai-result-layout">
                        <div class="ai-main-content">
                            <h4>🤖 AI 分析结果</h4>
                            <div class="ai-text">${formatAiAnswer(aiAnswer)}</div>
                        </div>
                        <div class="ai-sources-panel">
                            <div class="ai-sources-header">📚 来源链接 <span>${articles.length}</span></div>
                            ${renderSourceList(articles)}
                        </div>
                    </div>
                `;
            } else if (isAiSearch && articles.length > 0) {
                // 只有来源没有 AI 分析
                html += `
                    <div class="ai-result-layout">
                        <div class="ai-main-content">
                            <div class="ai-text" style="color:#888;text-align:center;padding:30px;">
                                AI 分析暂无内容，请查看右侧来源链接
                            </div>
                        </div>
                        <div class="ai-sources-panel">
                            <div class="ai-sources-header">📚 来源链接 <span>${articles.length}</span></div>
                            ${renderSourceList(articles)}
                        </div>
                    </div>
                `;
            } else {
                // 传统搜索源：普通列表
                if (articles.length === 0) {
                    html += '<div class="empty-state"><div class="icon">📭</div><div>无结果</div></div>';
                } else {
                    // 检测是否是 YouTube 源
                    const isYoutubeSource = src === 'youtube';

                    if (isYoutubeSource) {
                        // YouTube 视频卡片布局（可点击播放）
                        html += articles.slice(0, 15).map(a => {
                            const videoId = extractYouTubeId(a.url);
                            const thumbnail = a.thumbnail || (videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '');
                            return `
                                <div class="youtube-card" onclick="playYoutubeVideo('${videoId}', '${a.title.replace(/'/g, "\\'")}')">
                                    <div class="youtube-thumbnail">
                                        ${thumbnail ? `<img src="${thumbnail}" alt="视频封面" onerror="this.src='https://img.youtube.com/vi/${videoId}/mqdefault.jpg'">` : '<div class="no-thumb">▶️</div>'}
                                        <div class="play-overlay"><span>▶</span></div>
                                    </div>
                                    <div class="youtube-info">
                                        <div class="youtube-title">${a.title || '无标题'}</div>
                                        <div class="youtube-meta">
                                            <span class="youtube-channel">${a.source || 'YouTube'}</span>
                                            ${a.views ? `<span class="youtube-views">${a.views} 观看</span>` : ''}
                                            ${a.published ? `<span class="youtube-date">${a.published}</span>` : ''}
                                            ${a.length ? `<span class="youtube-duration">${a.length}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');

                        if (articles.length > 15) {
                            html += `<div class="empty-state" style="padding:10px;color:#666;font-size:12px;">还有 ${articles.length - 15} 个视频未显示</div>`;
                        }
                    } else {
                        // 普通文章列表
                        html += articles.slice(0, 30).map(a => `
                            <div class="article-item" onclick="window.open('${a.url || '#'}', '_blank')">
                                <div class="article-source">
                                    ${a.source || 'Unknown'}
                                    ${a.country ? `<span class="country-tag">${a.country}</span>` : ''}
                                </div>
                                <div class="article-title">${a.title || '无标题'}</div>
                                <div class="article-meta">
                                    <span>${a.published || ''}</span>
                                    ${a.like_count ? `<span>❤️ ${a.like_count}</span>` : ''}
                                </div>
                            </div>
                        `).join('');

                        if (articles.length > 30) {
                            html += `<div class="empty-state" style="padding:10px;color:#666;font-size:12px;">还有 ${articles.length - 30} 条结果未显示</div>`;
                        }
                    }
                }
            }

            container.innerHTML = html;
        }

        // 从 URL 中提取 YouTube video ID
        function extractYouTubeId(url) {
            if (!url) return '';
            // 匹配各种 YouTube URL 格式
            const patterns = [
                /youtube\.com\/watch\?v=([a-zA-Z0-9_-]+)/,
                /youtube\.com\/embed\/([a-zA-Z0-9_-]+)/,
                /youtu\.be\/([a-zA-Z0-9_-]+)/,
                /youtube\.com\/v\/([a-zA-Z0-9_-]+)/
            ];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return '';
        }

        // 打开 YouTube 视频播放弹窗
        let currentYoutubeModal = null;
        function playYoutubeVideo(videoId, title) {
            if (!videoId) return;

            // 关闭已有弹窗
            if (currentYoutubeModal) {
                currentYoutubeModal.remove();
            }

            // 创建视频播放弹窗
            const modal = document.createElement('div');
            modal.className = 'youtube-modal';
            modal.innerHTML = `
                <div class="youtube-modal-content">
                    <div class="youtube-modal-header">
                        <span class="youtube-modal-title">${title}</span>
                        <button class="youtube-modal-close" onclick="closeYoutubeModal()">✕</button>
                    </div>
                    <div class="youtube-player-container">
                        <iframe
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen
                            class="youtube-player"
                        ></iframe>
                    </div>
                </div>
            `;

            // 点击背景关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeYoutubeModal();
            });

            document.body.appendChild(modal);
            currentYoutubeModal = modal;
        }

        function closeYoutubeModal() {
            if (currentYoutubeModal) {
                currentYoutubeModal.remove();
                currentYoutubeModal = null;
            }
        }

        // 渲染来源列表（紧凑样式）
        function renderSourceList(articles) {
            if (!articles || articles.length === 0) {
                return '<div style="padding:15px;color:#666;font-size:12px;">暂无来源</div>';
            }

            return articles.slice(0, 15).map((a, i) => `
                <div class="article-item" style="padding:10px 15px;" onclick="window.open('${a.url || '#'}', '_blank')">
                    <div class="article-source" style="font-size:11px;margin-bottom:3px;">
                        <span style="color:#00f3ff;background:#1a1a25;padding:1px 5px;border-radius:3px;">${i + 1}</span>
                        ${a.source || 'Source'}
                        ${a.score ? `<span style="color:#888;margin-left:5px;">相关度 ${(a.score * 100).toFixed(0)}%</span>` : ''}
                    </div>
                    <div class="article-title" style="font-size:12px;">${a.title || '无标题'}</div>
                    ${a.summary ? `<div style="font-size:11px;color:#888;margin-top:4px;line-height:1.4;">${a.summary.substring(0, 150)}${a.summary.length > 150 ? '...' : ''}</div>` : ''}
                </div>
            `).join('');
        }

        // 格式化 AI 分析内容（处理换行、链接等）
        function formatAiAnswer(text) {
            if (!text) return '';

            // 转义 HTML
            text = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // 将 URL 转为链接
            text = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

            // 处理引用标记 [1], [2] 等
            text = text.replace(/\[(\d+)\]/g, '<sup style="color:#00f3ff">[$1]</sup>');

            return text;
        }

        function showSummary(totalCount, stanceAnalysis) {
            const summarySection = document.getElementById('summarySection');
            summarySection.classList.add('active');

            // 显示翻译按钮（如果Ollama可用）
            const translateBtn = document.getElementById('translateBtn');
            if (ollamaAvailable) {
                translateBtn.style.display = 'inline-block';
            }

            // 统计信息
            let statsHtml = '';
            for (const [src, count] of Object.entries(sourceCounts)) {
                statsHtml += `<div class="summary-stat"><span class="label">${sourceNames[src]}:</span><span class="value">${count}</span></div>`;
            }
            statsHtml += `<div class="summary-stat" style="border-left:2px solid #00f3ff"><span class="label">去重后总计:</span><span class="value">${totalCount}</span></div>`;
            document.getElementById('summaryStats').innerHTML = statsHtml;

            // 过滤标签
            const filterTabs = document.getElementById('filterTabs');
            let tabsHtml = '<button class="filter-tab active" onclick="filterSummary(\'all\')">全部</button>';

            // 按国家生成标签
            const countries = [...new Set(allArticles.map(a => a.country).filter(c => c))];
            countries.forEach(c => {
                tabsHtml += `<button class="filter-tab" onclick="filterSummary('${c}')">${c}</button>`;
            });

            // 按源生成标签
            selectedSources.forEach(src => {
                tabsHtml += `<button class="filter-tab" onclick="filterSummary('src_${src}')">${sourceNames[src]}</button>`;
            });

            filterTabs.innerHTML = tabsHtml;

            // 渲染文章
            renderSummaryArticles();

            // 立场分析
            if (stanceAnalysis && !stanceAnalysis.error) {
                renderAnalysis(stanceAnalysis);
            }

            // 自动翻译标题（如果Ollama可用）
            if (ollamaAvailable && document.getElementById('useOllamaTranslate').checked) {
                translateAllTitles();
            }
        }

        async function translateAllTitles() {
            if (!allArticles || allArticles.length === 0) return;

            const model = document.getElementById('ollamaModelSelect').value;
            const titles = allArticles.map(a => a.title).filter(t => t);

            if (titles.length === 0) return;

            // 显示翻译状态
            const summarySection = document.getElementById('summarySection');
            let translateIndicator = document.getElementById('translateIndicator');
            if (!translateIndicator) {
                translateIndicator = document.createElement('div');
                translateIndicator.id = 'translateIndicator';
                translateIndicator.style.cssText = 'padding:10px;background:rgba(0,243,255,0.1);border-radius:8px;margin:10px 0;text-align:center;color:#00f3ff;';
                summarySection.querySelector('.summary-header').appendChild(translateIndicator);
            }
            translateIndicator.innerHTML = '<span class="mini-spinner"></span> 正在翻译标题...';
            translateIndicator.style.display = 'block';

            try {
                // 分批翻译，每批20条
                const batchSize = 20;
                const translations = [];

                for (let i = 0; i < titles.length; i += batchSize) {
                    const batch = titles.slice(i, i + batchSize);
                    translateIndicator.textContent = `翻译中... ${Math.min(i + batchSize, titles.length)}/${titles.length}`;

                    const resp = await fetch('/api/ollama/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ titles: batch, model: model || undefined })
                    });

                    const data = await resp.json();
                    if (data.translations) {
                        translations.push(...data.translations);
                    } else {
                        translations.push(...batch); // 失败时保留原文
                    }
                }

                // 更新文章标题
                allArticles.forEach((a, idx) => {
                    if (a.title && translations[idx]) {
                        a.title_cn = translations[idx];
                    }
                });

                translateIndicator.innerHTML = '✅ 标题已翻译为中文';
                translateIndicator.style.background = 'rgba(0,255,100,0.1)';
                translateIndicator.style.color = '#00ff64';

                // 重新渲染
                renderSummaryArticles();

                // 3秒后隐藏
                setTimeout(() => {
                    translateIndicator.style.display = 'none';
                }, 3000);

            } catch (e) {
                console.error('翻译失败:', e);
                translateIndicator.innerHTML = '❌ 翻译失败: ' + e.message;
                translateIndicator.style.background = 'rgba(255,100,100,0.1)';
                translateIndicator.style.color = '#ff6b6b';
            }
        }

        function renderSummaryArticles() {
            const container = document.getElementById('summaryArticles');

            let filtered = allArticles;
            if (currentFilter !== 'all') {
                if (currentFilter.startsWith('src_')) {
                    // 按源过滤
                    const src = currentFilter.replace('src_', '');
                    filtered = allArticles.filter(a => a.type === src);
                } else {
                    // 按国家过滤
                    filtered = allArticles.filter(a => a.country === currentFilter);
                }
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无数据</div></div>';
                return;
            }

            container.innerHTML = filtered.map(a => `
                <div class="article-item" onclick="window.open('${a.url || '#'}', '_blank')">
                    <div class="article-source">
                        <span style="background: rgba(0, 243, 255, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(0, 243, 255, 0.3);">引擎: ${a.type || '未分类'}</span>
                        ${a.source || 'Unknown'}
                        ${a.country ? `<span class="country-tag">${a.country}</span>` : ''}
                    </div>
                    <div class="article-title">${a.title_cn || a.title || '无标题'}</div>
                    ${a.title_cn && a.title ? `<div class="article-meta" style="color:#666;font-size:12px;margin-top:4px;">原文: ${a.title}</div>` : ''}
                    <div class="article-meta">
                        <span>${a.published || ''}</span>
                        ${a.like_count ? `<span>❤️ ${a.like_count}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterSummary(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderSummaryArticles();
        }

        function renderAnalysis(analysis) {
            const section = document.getElementById('analysisSection');
            const container = document.getElementById('analysisContent');
            section.classList.add('active');

            let html = '<div class="country-analysis">';

            if (analysis.country_analysis) {
                for (const [country, data] of Object.entries(analysis.country_analysis)) {
                    html += `
                        <div class="country-card">
                            <h3>${country}</h3>
                            <div class="stance-item">立场: <span>${data.stance || '-'}</span></div>
                            <div class="stance-item">语调: <span>${data.tone || '-'}</span></div>
                            <div class="stance-item">关注点: <span>${data.key_focus || '-'}</span></div>
                        </div>
                    `;
                }
            }

            html += '</div>';

            if (analysis.comparison) {
                html += `
                    <div style="margin-top: 20px; padding: 15px; background: #1a1a25; border-radius: 8px;">
                        <h4 style="color: #888; margin-bottom: 10px;">对比分析</h4>
                        <p style="font-size: 13px; line-height: 1.6;">${analysis.comparison.differences || ''}</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }
    </script>
</body>
</html>
